spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/use_autentica}
    username: ${DB_USER:use_autentica}
    password: ${DB_PASSWORD:use_autentica}

  jpa:
    open-in-view: false
    hibernate:
      # O schema é 100% controlado pelo Flyway. Nunca usar create/update aqui.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  # Render (e provedores parecidos) injetam a porta via PORT; localmente
  # (docker compose, dev sem Docker) continua valendo APP_PORT.
  port: ${PORT:${APP_PORT:8080}}

app:
  storage:
    local:
      base-path: ${STORAGE_LOCAL_BASE_PATH:./uploads}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

admin:
  seed:
    email: ${ADMIN_EMAIL:admin@useautentica.com}
    password: ${ADMIN_PASSWORD:admin123}
