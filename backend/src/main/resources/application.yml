spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/use_autentica}
    username: ${DB_USER:use_autentica}
    password: ${DB_PASSWORD:use_autentica}

  jpa:
    open-in-view: false
    hibernate:
      # O schema é 100% controlado pelo Flyway. Nunca usar create/update aqui.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${APP_PORT:8080}
