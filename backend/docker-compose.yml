services:
  db:
    image: postgres:16-alpine
    container_name: use-autentica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-use_autentica}
      POSTGRES_USER: ${DB_USER:-use_autentica}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-use_autentica}
    ports:
      - "5432:5432"
    volumes:
      - use-autentica-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-use_autentica}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: use-autentica-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-use_autentica}
      DB_USER: ${DB_USER:-use_autentica}
      DB_PASSWORD: ${DB_PASSWORD:-use_autentica}
      APP_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  use-autentica-db-data:
