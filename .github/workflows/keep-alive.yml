name: Keep backend awake

# O plano free do Render desliga o servico apos 15 min sem trafego; esse
# ping periodico evita a maior parte dos "cold starts" pro visitante.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/health
        run: curl -sf https://use-autentica-store.onrender.com/api/health
